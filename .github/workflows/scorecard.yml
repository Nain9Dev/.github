name: Ecosystem Architectural Scorecard

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Conformance Audit & Quality Scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Scorecard Audit
        run: python scripts/audit_ecosystem.py .
