name: Reusable Python Verification

on:
  workflow_call:
    inputs:
      python-version:
        description: "The Python version to setup"
        required: false
        default: "3.12"
        type: string
      requirements-file:
        description: "Path to requirements file"
        required: false
        default: "requirements.txt"
        type: string
      test-command:
        description: "Command to execute tests"
        required: false
        default: "pytest -v"
        type: string
      run-ruff:
        description: "Whether to run ruff linter check"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify-python:
    name: Verify Python (${{ inputs.python-version }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ inputs.requirements-file }}" ]; then
            pip install -r "${{ inputs.requirements-file }}"
          fi
          pip install ruff pytest pytest-cov

      - name: Lint with Ruff
        if: ${{ inputs.run-ruff }}
        run: ruff check .

      - name: Execute test suite
        run: ${{ inputs.test-command }}
